# Merge policy, read by scripts/merge-task.sh.
# The script - not an AI agent - decides whether a task branch may be merged into main.
# Agents must not edit this file (denied in .claude/settings.json).

# Master switch: on | off
AUTO_MERGE=on

# Push main to origin after a successful merge (owner 2026-11-23: on)
AUTO_PUSH=on

# Task types that skip QA: Dev reports `DEV: CHECK PASS @<sha>` instead (see docs/TASKS.md conventions)
QA_SKIP_TYPES="chore test"

# If the branch changes any file matching this regex, the owner must merge by hand
# (OWNER=1 ./scripts/merge-task.sh ...). Agent config, scripts, CLAUDE.md, Gradle wrapper/catalog,
# build files, manifests, proguard/consumer rules.
PROTECTED_PATHS_RE='(^\.claude/|^CLAUDE\.md$|^scripts/|^gradle/|build\.gradle(\.kts)?$|settings\.gradle(\.kts)?$|gradle\.properties$|AndroidManifest\.xml$|proguard|consumer-rules\.pro$)'

# Merge style: no-ff keeps one merge commit per task (matches history so far)
MERGE_METHOD=no-ff
